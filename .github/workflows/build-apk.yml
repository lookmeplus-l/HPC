name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Verify environment
        run: |
          flutter doctor -v
          echo "sdk.dir=${ANDROID_HOME}" > screen_matcher/android/local.properties
          echo "flutter.sdk=${FLUTTER_ROOT}" >> screen_matcher/android/local.properties

      - name: Get Flutter dependencies
        run: flutter pub get
        working-directory: screen_matcher

      - name: Build APK (debug)
        run: flutter build apk --debug
        working-directory: screen_matcher

      - name: Build APK (release)
        run: flutter build apk --release
        working-directory: screen_matcher

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: screen_matcher/build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: screen_matcher/build/app/outputs/flutter-apk/app-release.apk
