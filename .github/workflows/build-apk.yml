name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      - name: Accept Android SDK licenses
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Create local.properties
        run: |
          mkdir -p screen_matcher/android
          echo "sdk.dir=${ANDROID_HOME}" > screen_matcher/android/local.properties
          echo "flutter.sdk=${FLUTTER_ROOT}" >> screen_matcher/android/local.properties

      - name: Get Flutter dependencies
        run: flutter pub get
        working-directory: screen_matcher

      - name: Build APK (debug)
        run: flutter build apk --debug
        working-directory: screen_matcher

      - name: Build APK (release)
        run: flutter build apk --release
        working-directory: screen_matcher

      - name: Upload debug APK to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: screen_matcher/build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload release APK to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: screen_matcher/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: |
            screen_matcher/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
